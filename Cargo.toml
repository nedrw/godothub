[package]
name = "gdhub"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.31"
egui = "0.31"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "6.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["stream", "json"] }
futures = "0.3"
zip = "2.0"
log = "0.4"
env_logger = "0.11"
thiserror = "2.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
rfd = "0.15"
rust-ini = "0.21"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
